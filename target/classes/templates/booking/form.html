<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Book Service')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 fade-in">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0 text-center">
                        <h3 class="fw-bold text-coffee">Book a Service</h3>
                        <p class="text-muted small">Complete the form below to request a professional.</p>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/user/book}" th:object="${booking}" method="post">

                            <!-- Filter Controls -->
                            <div class="mb-4 p-3 bg-light rounded-3">
                                <label class="form-label text-muted small fw-bold text-uppercase">1. Find
                                    Professional</label>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <select id="categoryFilter" class="form-select border-0 shadow-sm">
                                                <option value="">All Categories</option>
                                                <option th:each="cat : ${categories}" th:value="${cat}"
                                                    th:text="${cat.displayName}"></option>
                                            </select>
                                            <label for="categoryFilter">Category</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating">
                                            <select class="form-select border-0 shadow-sm" th:field="*{providerId}"
                                                id="providerSelect" required>
                                                <option value="" data-rate="0">-- Select Provider --</option>
                                                <option th:each="prov : ${providers}" th:value="${prov.id}"
                                                    th:data-rate="${prov.hourlyRate}"
                                                    th:data-category="${prov.category}"
                                                    th:data-location="${prov.user.address != null ? prov.user.address.toLowerCase() : ''}"
                                                    th:text="${prov.user.name + ' (' + prov.category.displayName + ') - ₹' + prov.hourlyRate + '/hr'}">
                                                </option>
                                            </select>
                                            <label for="providerSelect">Provider</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <label class="form-label text-muted small fw-bold text-uppercase">2. Service Details</label>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="datetime-local" class="form-control" th:field="*{serviceDate}"
                                            id="serviceDate" placeholder="Date" required>
                                        <label for="serviceDate">Date & Time</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="number" class="form-control" th:field="*{durationHours}"
                                            id="durationInput" min="1" max="8" value="1" placeholder="Hours" required>
                                        <label for="durationInput">Duration (Hours)</label>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="form-floating">
                                    <textarea class="form-control" th:field="*{serviceAddress}" id="serviceAddress"
                                        placeholder="Address" style="height: 100px" required></textarea>
                                    <label for="serviceAddress">Service Address</label>
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="form-floating">
                                    <textarea class="form-control" th:field="*{comments}" id="comments"
                                        placeholder="Comments" style="height: 100px"></textarea>
                                    <label for="comments">Specific Instructions (Optional)</label>
                                </div>
                            </div>

                            <div
                                class="alert alert-light border d-flex justify-content-between align-items-center mb-4">
                                <span><strong>Estimated Total:</strong></span>
                                <span class="fs-3 fw-bold text-accent">₹<span id="totalCost">0.00</span></span>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill py-3">Confirm
                                    Booking</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const categoryFilter = document.getElementById('categoryFilter');
            const providerSelect = document.getElementById('providerSelect');
            const durationInput = document.getElementById('durationInput');
            const totalCostSpan = document.getElementById('totalCost');

            const originalOptions = Array.from(providerSelect.options).slice(1); // Skip placeholder

            function filterProviders() {
                const category = categoryFilter.value;

                // Reset
                providerSelect.innerHTML = '<option value="" data-rate="0">-- Choose a Professional --</option>';

                originalOptions.forEach(option => {
                    const optCategory = option.getAttribute('data-category');

                    const matchesCategory = category === "" || optCategory === category;

                    if (matchesCategory) {
                        providerSelect.appendChild(option);
                    }
                });

                // Reset Selection
                providerSelect.value = "";
                calculateCost();
            }

            categoryFilter.addEventListener('change', filterProviders);

            function calculateCost() {
                const selectedIndex = providerSelect.selectedIndex;

                if (selectedIndex < 0 || providerSelect.value === "") {
                    // No valid selection
                    totalCostSpan.textContent = "0.00";
                    return;
                }

                const selectedOption = providerSelect.options[selectedIndex];
                const rate = selectedOption ? (parseFloat(selectedOption.getAttribute('data-rate')) || 0) : 0;
                const duration = parseInt(durationInput.value) || 0;
                const total = rate * duration;

                totalCostSpan.textContent = total.toFixed(2);
            }

            providerSelect.addEventListener('change', calculateCost);
            durationInput.addEventListener('input', calculateCost);

            // Initial calc
            calculateCost();
        });
    </script>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>
