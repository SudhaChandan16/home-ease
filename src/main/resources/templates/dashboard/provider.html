<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Provider Dashboard')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container py-5">
        <div class="row mb-5 fade-in">
            <div class="col-md-8">
                <h2 class="fw-bold text-coffee">Provider Dashboard</h2>
                <p class="text-muted">Welcome back! Manage your availability and requests.</p>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-0 fw-bold">Availability Status</h6>
                            <small th:text="${provider.isAvailable ? 'You are visible' : 'You are hidden'}"
                                class="text-muted"></small>
                        </div>
                        <form th:action="@{/provider/availability}" method="post">
                            <div class="form-check form-switch fs-4">
                                <input class="form-check-input" type="checkbox" name="isAvailable" value="true"
                                    onchange="this.form.submit()" th:checked="${provider.isAvailable}"
                                    style="cursor: pointer;">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4 fade-in delay-100">
            <div class="col-md-6 col-lg-4">
                <div class="card p-3 border-0 shadow-sm h-100 border-start border-4 border-warning">
                    <div class="d-flex align-items-center">
                        <div class="bg-warning bg-opacity-10 text-warning rounded-circle p-3 me-3">
                            <i class="fas fa-clipboard-list fa-lg"></i>
                        </div>
                        <div>
                            <p class="text-muted mb-0 small">Pending Requests</p>
                            <h3 class="fw-bold mb-0" th:text="${bookings.size()}">0</h3>
                            <!-- Ideally filter for PENDING -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-4">
                <div class="card p-3 border-0 shadow-sm h-100 border-start border-4 border-success">
                    <div class="d-flex align-items-center">
                        <div class="bg-success bg-opacity-10 text-success rounded-circle p-3 me-3">
                            <i class="fas fa-coins fa-lg"></i>
                        </div>
                        <div>
                            <p class="text-muted mb-0 small">Hourly Rate</p>
                            <h3 class="fw-bold mb-0" th:text="'₹' + ${provider.hourlyRate}">₹0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 fade-in delay-200">
            <div class="card-header bg-white border-0 py-3">
                <h5 class="mb-0 fw-bold text-coffee">Booking Requests</h5>
            </div>
            <div class="card-body p-0">
                <div th:if="${bookings.empty}" class="text-center py-5">
                    <i class="fas fa-inbox fa-3x text-light mb-3"></i>
                    <p class="text-muted">No booking requests yet.</p>
                </div>

                <div class="table-responsive" th:if="${!bookings.empty}">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="bg-light text-secondary">
                            <tr>
                                <th class="border-0 ps-4">Date & Time</th>
                                <th class="border-0">Customer</th>
                                <th class="border-0">Address</th>
                                <th class="border-0">Status</th>
                                <th class="border-0">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="booking : ${bookings}">
                                <td class="ps-4 fw-bold"
                                    th:text="${#temporals.format(booking.serviceDate, 'dd-MM-yyyy HH:mm')}"></td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="bg-coffee text-white rounded-circle p-2 me-2 small">
                                            <i class="fas fa-user"></i>
                                        </div>
                                        <span th:text="${booking.user.name}"></span>
                                    </div>
                                </td>
                                <td class="text-muted small" th:text="${booking.serviceAddress}"></td>
                                <td>
                                    <span class="badge"
                                        th:classappend="${booking.status.name() == 'PENDING' ? 'bg-warning' : 
                                                        (booking.status.name() == 'CONFIRMED' ? 'bg-success' : 'bg-danger')}"
                                        th:text="${booking.status}">Status</span>
                                </td>
                                <td>
                                    <span th:if="${booking.status.name() == 'PENDING'}"
                                        class="text-muted small fst-italic">
                                        <i class="fas fa-envelope-open-text me-1"></i>Check Email to Respond
                                    </span>
                                    <span th:unless="${booking.status.name() == 'PENDING'}" class="text-muted">-</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>
