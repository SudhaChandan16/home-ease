<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container py-5">
        <h2 class="fw-bold text-coffee mb-4 fade-in">Admin Dashboard</h2>

        <!-- Stats Cards -->
        <div class="row g-4 mb-5 fade-in delay-100">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100 overflow-hidden">
                    <div class="card-body position-relative">
                        <div class="d-flex justify-content-between">
                            <div>
                                <p class="text-muted mb-1 text-uppercase small fw-bold">Total Providers</p>
                                <h2 class="display-6 fw-bold text-coffee" th:text="${providers.size()}">0</h2>
                            </div>
                            <div class="bg-accent bg-opacity-10 text-accent rounded-circle p-3 d-flex align-items-center justify-content-center"
                                style="width: 60px; height: 60px;">
                                <i class="fas fa-user-tie fa-lg"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100 overflow-hidden">
                    <div class="card-body position-relative">
                        <div class="d-flex justify-content-between">
                            <div>
                                <p class="text-muted mb-1 text-uppercase small fw-bold">Total Users</p>
                                <h2 class="display-6 fw-bold text-coffee">--</h2>
                            </div>
                            <div class="bg-success bg-opacity-10 text-success rounded-circle p-3 d-flex align-items-center justify-content-center"
                                style="width: 60px; height: 60px;">
                                <i class="fas fa-users fa-lg"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100 overflow-hidden">
                    <div class="card-body position-relative">
                        <div class="d-flex justify-content-between">
                            <div>
                                <p class="text-muted mb-1 text-uppercase small fw-bold">Total Bookings</p>
                                <h2 class="display-6 fw-bold text-coffee">--</h2>
                            </div>
                            <div class="bg-warning bg-opacity-10 text-warning rounded-circle p-3 d-flex align-items-center justify-content-center"
                                style="width: 60px; height: 60px;">
                                <i class="fas fa-bookmark fa-lg"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Provider List -->
        <div class="card shadow-sm border-0 fade-in delay-200">
            <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-coffee">All Service Providers</h5>
                <button class="btn btn-sm btn-outline-primary"><i class="fas fa-download me-2"></i>Export</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="bg-light text-secondary">
                            <tr>
                                <th class="border-0 ps-4">ID</th>
                                <th class="border-0">Name</th>
                                <th class="border-0">Category</th>
                                <th class="border-0">Info</th>
                                <th class="border-0">Stats</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="provider : ${providers}">
                                <td class="ps-4 text-muted small" th:text="'#' + ${provider.id}">#1</td>
                                <td>
                                    <div>
                                        <p class="mb-0 fw-bold text-coffee" th:text="${provider.user.name}">Name</p>
                                        <small class="text-muted" th:text="${provider.user.email}">Email</small>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border"
                                        th:text="${provider.category}">Category</span>
                                </td>
                                <td>
                                    <small class="d-block"><i class="fas fa-tag me-1 text-muted"></i> ₹<span
                                            th:text="${provider.hourlyRate}"></span>/hr</small>
                                </td>
                                <td>
                                    <small class="fw-bold" th:text="${provider.experienceYears} + ' Yrs'">Exp</small>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>
