<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Booking Status Update</title>
</head>

<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px;">
        <h2 th:style="'color:' + (${status} == 'Confirmed' ? '#28a745' : '#dc3545')" th:text="'Booking ' + ${status}">
            Booking Update</h2>

        <p>Hello <span th:text="${userName}">User</span>,</p>

        <p>Your booking request has been <strong><span th:text="${status}">Status</span></strong> by the provider.</p>

        <div style="background-color: #f9f9f9; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <p><strong>Provider:</strong> <span th:text="${providerName}">Provider Name</span></p>
            <p><strong>Scheduled Date:</strong> <span th:text="${serviceDate}">Date</span></p>
        </div>

        <p>Thank you for using Home Ease!</p>
    </div>
</body>

</html>
