<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Find Professionals')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container py-5">
        <div class="row mb-5 fade-in">
            <div class="col-md-12 text-center">
                <h2 class="fw-bold text-coffee mb-2">Find Your Pro</h2>
                <p class="text-muted">Browse top-rated professionals for your home needs</p>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="card shadow-sm mb-5 border-0 bg-white fade-in delay-100">
            <div class="card-body p-4">
                <form th:action="@{/user/find}" method="get" class="row g-3 align-items-end justify-content-center">
                    <div class="col-md-3">
                        <label class="form-label fw-bold text-muted small text-uppercase">Category</label>
                        <select name="category" class="form-select border-0 bg-light">
                            <option value="">All Categories</option>
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}"
                                th:selected="${cat == selectedCategory}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold text-muted small text-uppercase">Location</label>
                        <input type="text" name="city" class="form-control border-0 bg-light"
                            placeholder="Enter city (e.g. New York)" th:value="${selectedCity}">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100"><i
                                class="fas fa-search me-2"></i>Search</button>
                    </div>
                    <div class="col-md-2">
                        <a th:href="@{/user/find}" class="btn btn-outline-secondary w-100">Clear</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Provider Grid -->
        <div class="row g-4">
            <!-- Empty State -->
            <div class="col-12" th:if="${providers.empty}">
                <div class="text-center py-5">
                    <div class="mb-3">
                        <i class="fas fa-search fa-3x text-muted"></i>
                    </div>
                    <h4>No professionals found</h4>
                    <p class="text-muted">Try adjusting your filters or search for a different location.</p>
                </div>
            </div>

            <!-- Provider Card -->
            <div class="col-md-4 col-sm-6" th:each="provider : ${providers}">
                <div class="card h-100 shadow-sm border-0 hover-lift transition-all">
                    <div class="position-relative">
                        <!-- Placeholder for Cover/Image -->
                        <div th:class="'card-img-top text-white d-flex align-items-center justify-content-center ' + ${provider.category.bgClass}"
                            style="height: 150px; border-radius: 0.375rem 0.375rem 0 0;">
                            <i th:class="${provider.category.iconClass} + ' fa-4x opacity-75'"></i>
                        </div>
                        <span th:if="${provider.isAvailable}"
                            class="position-absolute top-0 end-0 m-2 badge bg-success shadow-sm">Available</span>
                        <span th:unless="${provider.isAvailable}"
                            class="position-absolute top-0 end-0 m-2 badge bg-secondary shadow-sm">Busy</span>
                    </div>
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold mb-1" th:text="${provider.user.name}">Provider Name</h5>
                        <p th:class="'small fw-bold mb-2 ' + ${provider.category.textClass}"
                            th:text="${provider.category.displayName}">Category</p>

                        <div class="mb-3 text-muted small">
                            <i class="fas fa-map-marker-alt me-1"></i> <span
                                th:text="${provider.user.address != null ? provider.user.address : 'Location N/A'}">City</span>
                            <span class="mx-2">|</span>
                            <i class="fas fa-briefcase me-1"></i> <span
                                th:text="${provider.experienceYears + ' Years'}">Exp</span>
                        </div>

                        <p class="card-text text-muted small text-truncate" style="max-height: 3em;"
                            th:text="${provider.bio != null ? provider.bio : 'No bio available.'}">Bio...</p>

                        <h4 class="mb-3">₹<span th:text="${provider.hourlyRate}">0.0</span><small
                                class="text-muted fs-6">/hr</small></h4>

                        <div class="d-grid gap-2">
                            <a th:href="@{/user/profile/{id}(id=${provider.id})}" class="btn btn-outline-primary">View
                                Profile</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-12 text-center text-muted small">
                Showing all matching results.
            </div>
        </div>
    </div>

    <style>
        .hover-lift:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
        }

        .transition-all {
            transition: all 0.3s ease;
        }
    </style>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>
