<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Register - Home Ease')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 fade-in">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-coffee">Create Account</h2>
                    <p class="text-muted">Join our community today</p>
                </div>
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div th:if="${error}" class="alert alert-danger d-flex align-items-center" th:text="${error}">
                        </div>

                        <form th:action="@{/register}" th:object="${user}" method="post">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" th:field="*{name}" id="name"
                                    placeholder="Full Name" required>
                                <label for="name">Full Name</label>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}"
                                    th:errors="*{name}"></div>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" th:field="*{email}" id="email"
                                    placeholder="Email" required>
                                <label for="email">Email Address</label>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}"
                                    th:errors="*{email}"></div>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="tel" class="form-control" th:field="*{mobile}" id="mobile"
                                    placeholder="Mobile" required>
                                <label for="mobile">Mobile Number</label>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('mobile')}"
                                    th:errors="*{mobile}"></div>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" th:field="*{password}" id="password"
                                    placeholder="Password" required>
                                <label for="password">Password</label>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}"
                                    th:errors="*{password}"></div>
                            </div>
                            <div class="form-floating mb-4">
                                <textarea class="form-control" th:field="*{address}" id="address" placeholder="Address"
                                    style="height: 100px"></textarea>
                                <label for="address">Address</label>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill">Register</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <small class="text-muted">Want to be a provider? <a href="/register/provider"
                            class="fw-bold text-decoration-none text-accent">Join our Pro Network</a></small>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>
