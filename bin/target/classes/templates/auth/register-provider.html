<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Become a Provider - Home Ease')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-9 fade-in">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-coffee">Join as a Professional</h2>
                    <p class="text-muted">Grow your business with Home Ease</p>
                </div>
                <!-- Card -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-5">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <form th:action="@{/register/provider}" th:object="${user}" method="post">
                            <h5 class="mb-4 text-accent fw-bold text-uppercase small ls-1">1. Personal Information</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" th:field="*{name}" id="name"
                                            placeholder="Full Name" required>
                                        <label for="name">Full Name</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="email" class="form-control" th:field="*{email}" id="email"
                                            placeholder="Email" required>
                                        <label for="email">Email Address</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="tel" class="form-control" th:field="*{mobile}" id="mobile"
                                            placeholder="Mobile" required>
                                        <label for="mobile">Mobile Number</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" th:field="*{password}" id="password"
                                            placeholder="Password" required>
                                        <label for="password">Password</label>
                                    </div>
                                </div>
                            </div>

                            <div class="form-floating mb-4">
                                <textarea class="form-control" th:field="*{address}" id="address" placeholder="Address"
                                    style="height: 100px" required></textarea>
                                <label for="address">Address / Location</label>
                            </div>

                            <h5 class="mb-4 text-accent fw-bold text-uppercase small ls-1 mt-5">2. Professional Details
                            </h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <select class="form-select" th:field="*{category}" id="category">
                                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">
                                            </option>
                                        </select>
                                        <label for="category">Service Category</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-floating">
                                        <input type="number" step="0.01" class="form-control" th:field="*{hourlyRate}"
                                            id="rate" placeholder="Rate" required>
                                        <label for="rate">Hourly Rate (₹)</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-floating">
                                        <input type="number" class="form-control" th:field="*{experienceYears}" id="exp"
                                            placeholder="Years" required>
                                        <label for="exp">Experience (Yrs)</label>
                                    </div>
                                </div>
                            </div>

                            <div class="form-floating mb-4">
                                <textarea class="form-control" th:field="*{bio}" id="bio" placeholder="Bio"
                                    style="height: 120px"></textarea>
                                <label for="bio">Bio / Skills Description</label>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-coffee btn-lg text-white rounded-pill">Register as
                                    Provider</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <small class="text-muted">Already have an account? <a href="/login"
                            class="fw-bold text-decoration-none text-accent">Login here</a></small>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>
