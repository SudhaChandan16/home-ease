<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Booking Response')}"></head>

<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container text-center mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-body p-5">
                <h2 class="mb-4">Booking Update</h2>

                <div th:if="${message == 'Booking Confirmed'}" class="text-success">
                    <i class="fas fa-check-circle fa-4x mb-3"></i>
                    <h3>Confirmed!</h3>
                    <p>You have successfully accepted the booking request.</p>
                </div>

                <div th:if="${message == 'Booking Rejected'}" class="text-danger">
                    <i class="fas fa-times-circle fa-4x mb-3"></i>
                    <h3>Rejected</h3>
                    <p>You have rejected the booking request.</p>
                </div>

                <div th:if="${message != 'Booking Confirmed' and message != 'Booking Rejected'}" class="text-warning">
                    <i class="fas fa-exclamation-triangle fa-4x mb-3"></i>
                    <h3 th:text="${message}">Message</h3>
                </div>

                <a href="/" class="btn btn-primary mt-4">Back to Home</a>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>
